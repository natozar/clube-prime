name: jackpot-diag

# Só manual. O repo é público (log público) — o script já higieniza a saída.
on:
  workflow_dispatch:
    inputs:
      fix:
        description: 'Criar o ciclo faltante? (1 = sim, vazio = só diagnóstico)'
        required: false
        default: ''
      alvo:
        description: 'cliente_id alvo do fix'
        required: false
        default: ''
      piloto_add:
        description: 'cliente_id a incluir em piloto_clientes'
        required: false
        default: ''

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: diagnóstico jackpot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIX: ${{ inputs.fix }}
          ALVO: ${{ inputs.alvo }}
          PILOTO_ADD: ${{ inputs.piloto_add }}
        run: node seo/scripts/jackpot-diagnostico.js
